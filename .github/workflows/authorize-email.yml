name: Authorize ACT DA report email

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Base64-encoded one-time encryption public key"
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start Microsoft authorization
        run: node src/start-email-authorization.mjs
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      - name: Publish the short-lived authorization code
        uses: actions/upload-artifact@v4
        with:
          name: email-device-code
          path: /tmp/email-device-code.json
          retention-days: 1
      - name: Wait for Microsoft approval
        run: node src/authorize-email.mjs
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          AUTH_PUBLIC_KEY_B64: ${{ inputs.public_key }}
      - name: Upload the encrypted refresh token
        uses: actions/upload-artifact@v4
        with:
          name: email-authorization-token
          path: /tmp/email-authorization-token.json
          retention-days: 1
