name: Monitor and email Decarby awards

on:
  schedule:
    # 22:00 UTC Sunday is 06:00 Monday PHT.
    - cron: "0 22 * * 0"
    # 22:00 UTC Thursday is 06:00 Friday PHT.
    - cron: "0 22 * * 4"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the formatted Outlook briefing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: decarby-awards-monitor
  cancel-in-progress: false

jobs:
  scan-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan official award sources and build report
        run: npm run awards-monitor
        env:
          SEND_EMAIL: ${{ github.event.schedule == '0 22 * * 0' || inputs.send_email }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          REPORT_RECIPIENT: nathalie@decarbysolar.com.au
      - name: Save the latest scan state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/awards-scan-state.json reports/awards-latest.json reports/awards-latest.html
          git commit -m "Update Decarby awards scan" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: decarby-awards-report
          path: |
            reports/awards-latest.json
            reports/awards-latest.html
            outputs/decarby_awards_2027/Decarby_Awards_Pipeline_2027.xlsx
          retention-days: 30
