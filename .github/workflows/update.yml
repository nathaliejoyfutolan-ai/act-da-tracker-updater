name: Update ACT DA tracker

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
    - cron: "17 2 1 * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Workflow operation"
        required: true
        default: "update"
        type: choice
        options:
          - update
          - inspect

permissions:
  contents: write

concurrency:
  group: act-da-workbook
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh, repair, and validate the tracker
        if: github.event_name == 'schedule' || inputs.operation == 'update'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run update; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
      - run: npm run inspect-workbook
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          WORKBOOK_INSPECT_KEY: ${{ secrets.WORKBOOK_INSPECT_KEY }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
        with:
          name: encrypted-workbook-inspection
          path: /tmp/workbook-inspection.enc
          retention-days: 1
      - name: Keep the public scheduled workflow active
        if: github.event.schedule == '17 2 1 * *'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-active
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-active
          git commit -m "Keep scheduled updater active" || exit 0
          git push
